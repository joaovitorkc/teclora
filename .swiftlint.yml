# Quality gates (vibe-coding-toolkit 08, equivalente Swift).
# Só o que o prompt instala: teto de arquivo e console direto.
# Não é um guia de estilo — only_rules apaga o restante do SwiftLint.
#
# Pulada: quality/no-direct-data-access — este app não tem cliente de
# banco/ORM; o prompt manda remover a regra em vez de inventar fronteira.
#
# TecloraLog (os.Logger) é o adaptador. A regra segue ligada: o helper
# não chama print, então não há exclusão de arquivo.

only_rules:
  - file_length
  - no_direct_print

included:
  - Teclora

excluded:
  - DerivedData
  - .build
  - Teclora.xcodeproj

# Teto 350. Zero ofensores na instalação → error (não warn).
# SwiftLint dispara em lineCount > 350, igual ao quality/max-lines (lines > max).
file_length:
  warning: 350
  error: 350

custom_rules:
  no_direct_print:
    name: "no_direct_print"
    regex: '\b(?:print|debugPrint|dump|NSLog)\s*\('
    match_kinds:
      - identifier
    message: "Use the project logging helper instead of print/debugPrint/dump/NSLog."
    severity: error
